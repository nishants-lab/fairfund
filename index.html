    <!-- Open Graph / Twitter card: makes any shared FairFund link unfurl into a
         branded preview on Twitter, WhatsApp, Slack, LinkedIn, iMessage. These
         must be static in the served HTML because social crawlers do not run JS
         and never see the #/ hash route, so all links resolve to this one card. -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FairFund" />
    <meta property="og:title" content="FairFund - Forward-looking MF Research for India" />
    <meta property="og:description" content="Forward-looking mutual fund research across __FUND_COUNT__ Indian funds: consistency, skill-vs-luck and downside-protection signals. Evidence, not advice." />
    <meta property="og:url" content="https://nishants-lab.github.io/fairfund/" />
    <meta property="og:image" content="https://nishants-lab.github.io/fairfund/og-cover.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="FairFund - forward-looking mutual fund research for India" />
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FairFund - Forward-looking MF Research for India" />
    <meta name="twitter:description" content="Forward-looking mutual fund research across __FUND_COUNT__ Indian funds: consistency, skill-vs-luck and downside-protection signals. Evidence, not advice." />
    <meta name="twitter:image" content="https://nishants-lab.github.io/fairfund/og-cover.png" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;0,6..72,700;1,6..72,400;1,6..72,600&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <title>FairFund - Forward-looking MF Research for India</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      // Restore SPA redirect path (from 404.html)
      (function() {
        var redir = sessionStorage.getItem('spa-redirect');
        if (redir) {
          sessionStorage.removeItem('spa-redirect');
          history.replaceState(null, '', redir);
        }
      })();
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
