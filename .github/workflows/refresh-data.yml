name: Refresh Fund Data

on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 3 6-15,27 * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Run full metrics recomputation
        type: boolean
        default: false
      run_monthly:
        description: Also run monthly holdings refresh
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  daily-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Append daily NAV from AMFI
        run: python scripts/update_nav_daily.py

      - name: Recompute metrics from fresh NAV
        run: python pipeline/compute_metrics.py

      - name: Recompute rankings
        run: python pipeline/compute_rankings.py

      - name: Rebuild analytics
        run: python scripts/build_analytics.py

      - name: Split fund data for serving
        run: python migrations/split-analytics/split_funds.py

      - name: Commit updated data
        run: |
          git config user.name fairfund-bot
          git config user.email bot@fairfund.in
          git add src/data/ public/nav/ public/fund-data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily refresh $(date +%Y-%m-%d)"
            git push
          fi

      - name: Build site
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist

  monthly-holdings:
    if: github.event_name == 'workflow_dispatch' && inputs.run_monthly || github.event_name == 'schedule' && github.event.schedule == '30 3 6-15,27 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: daily-nav
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt && pip install requests yfinance

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Recompute metrics
        run: python pipeline/compute_metrics.py

      - name: Recompute rankings
        run: python pipeline/compute_rankings.py

      - name: Capture holdings snapshots
        run: python scripts/capture_holdings_snapshot.py
        env:
          FF_CAPTURE_LIMIT: ""

      - name: Build stock moves
        run: python scripts/build_stock_moves.py

      - name: Commit holdings data
        run: |
          git config user.name fairfund-bot
          git config user.email bot@fairfund.in
          git add public/holdings-history/ src/data/ public/fund-data/
          if git diff --staged --quiet; then
            echo "No holdings changes"
          else
            git commit -m "data: monthly holdings refresh $(date +%Y-%m-%d)"
            git push
          fi
