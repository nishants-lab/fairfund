name: Refresh Fund Data

on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 3 6-15,27 * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Run full metrics recomputation
        type: boolean
        default: false
      run_monthly:
        description: Also run monthly holdings refresh
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-nav:
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Append daily NAV from AMFI
        run: python scripts/update_nav_daily.py

      # New funds join the morning after their first NAV instead of waiting for
      # the monthly discovery PR. Add-only: closures and renames stay with the
      # monthly reviewed run (discover-funds.yml), and a day that shows more than
      # discover_new_funds.MAX_DAILY_ADDS new funds adds none and leaves them to
      # it. Any failure here restores the pre-intake files, so a broken intake
      # never blocks the NAV refresh of the funds already listed. Manager and risk
      # data are optional (as in the monthly run): their failures only warn. The finalize
      # sequence matches the monthly run: prune_pending gives a fund with no
      # holdings yet its "new fund" stub and recounts categories; the next two
      # steps rank the final cohort.
      - name: Admit and onboard funds that started trading
        id: intake
        run: |
          set -o pipefail
          git add -A src/data/ public/nav/ public/fund-data/ public/holdings-history/ public/category-median/
          n=0
          if python pipeline/discover_new_funds.py --add-only | tee "$RUNNER_TEMP/intake.txt"; then
            n=$(grep -oE 'Added: [0-9]+' "$RUNNER_TEMP/intake.txt" | tail -1 | grep -oE '[0-9]+' || echo 0)
          else
            n=failed
          fi
          if [ "$n" != "0" ] && [ "$n" != "failed" ]; then
            {
              python pipeline/build_matcher_universe.py &&
              python migrations/split-analytics/split_funds.py &&
              python scripts/onboard_new_funds.py &&
              { python scripts/fetch_sebi_risk.py --missing-only || echo "::warning::SEBI risk fetch failed; the monthly run retries"; } &&
              { python scripts/fetch_managers.py || echo "::warning::Manager fetch failed; the monthly run retries"; } &&
              { python scripts/build_manager_signals.py || echo "::warning::Manager signals failed"; } &&
              python scripts/enrich_fund_data.py &&
              python pipeline/compute_metrics.py &&
              python pipeline/compute_rankings.py &&
              python migrations/split-analytics/split_funds.py &&
              python scripts/prune_pending.py
            } || n=failed
          fi
          if [ "$n" = "failed" ]; then
            echo "::warning::Daily fund intake failed; restored the pre-intake data, listed funds refresh as usual"
            git checkout -- src/data/ public/nav/ public/fund-data/ public/holdings-history/ public/category-median/
            git clean -fdq -- src/data/ public/nav/ public/fund-data/ public/holdings-history/ public/category-median/
            n=0
          fi
          git reset -q
          echo "admitted=$n" >> "$GITHUB_OUTPUT"
          echo "Funds admitted today: $n" >> "$GITHUB_STEP_SUMMARY"

      - name: Recompute metrics from fresh NAV
        run: python pipeline/compute_metrics.py

      - name: Recompute rankings
        run: python pipeline/compute_rankings.py

      - name: Rebuild peer analytics from current NAV
        run: python scripts/build_analytics.py

      - name: Split fund data for serving
        run: python migrations/split-analytics/split_funds.py

      - name: Quarantine unverified NAV-derived values
        run: python scripts/quarantine_nav.py --apply

      - name: Synchronize shared analytics and verify parity
        run: |
          python scripts/sync_analytics_to_shells.py
          python scripts/sync_analytics_to_shells.py --check

      - name: Rebuild rolling-alpha series (re-inject; upstream steps drop it)
        run: python scripts/build_rolling_alpha.py

      - name: Rebuild category benchmarks from current NAV
        run: python scripts/build_category_median.py

      - name: Rebuild search aliases (former fund names)
        run: python scripts/build_former_names.py

      - name: Refresh new fund offers (AMFI scheme master)
        run: python scripts/build_nfo.py
        continue-on-error: true

      # Fund-house names from AMFI, then the data behind the Movers page
      # (estimated flows, costs, manager and portfolio changes).
      - name: Build Movers data
        run: |
          python scripts/normalize_amc.py
          python scripts/build_movers.py

      - name: Smoke test (validate data integrity)
        run: python tests/smoke.py

      - name: Validate research contracts
        uses: ./.github/actions/validate

      - name: Commit updated data
        run: |
          git config user.name fairfund-bot
          git config user.email 52659071+nishants-lab@users.noreply.github.com
          git add src/data/ public/nav/ public/fund-data/ public/category-median/ public/holdings-history/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily refresh $(date +%Y-%m-%d)"
            git push
          fi

      - name: Build site
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: daily-nav
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  monthly-holdings:
    if: github.event_name == 'workflow_dispatch' && inputs.run_monthly || github.event_name == 'schedule' && github.event.schedule == '30 3 6-15,27 * *'
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    needs: daily-nav
    outputs:
      changed: ${{ steps.commit-holdings.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Capture holdings snapshots
        run: python scripts/capture_holdings_snapshot.py
        env:
          FF_CAPTURE_LIMIT: ""

      - name: Build stock moves
        run: python scripts/build_stock_moves.py

      - name: Compute holdings changes (MoM)
        run: python scripts/add_holdings_change.py

      - name: Enrich fund-data with AUM and expense ratio
        run: python scripts/enrich_fund_data.py

      # --refresh-all re-asks Groww for lists a month old, so manager changes in
      # existing funds are seen; a failed fetch keeps the earlier list.
      - name: Refresh fund manager data (Groww)
        run: python scripts/fetch_managers.py --refresh-all
        continue-on-error: true

      - name: Build manager quality signals
        run: python scripts/build_manager_signals.py
        continue-on-error: true

      - name: Refresh SEBI riskometer (Groww)
        run: python scripts/fetch_sebi_risk.py
        continue-on-error: true

      - name: Recompute metrics
        run: python pipeline/compute_metrics.py

      - name: Recompute rankings
        run: python pipeline/compute_rankings.py

      - name: Rebuild peer analytics from current NAV
        run: python scripts/build_analytics.py

      - name: Quarantine unverified NAV-derived values
        run: python scripts/quarantine_nav.py --apply

      - name: Synchronize shared analytics and verify parity
        run: |
          python scripts/sync_analytics_to_shells.py
          python scripts/sync_analytics_to_shells.py --check

      - name: Rebuild rolling-alpha series
        run: python scripts/build_rolling_alpha.py

      - name: Rebuild category benchmarks from current NAV
        run: python scripts/build_category_median.py

      - name: Rebuild search aliases (former fund names)
        run: python scripts/build_former_names.py

      # Fund-house names from AMFI, then the data behind the Movers page
      # (estimated flows, costs, manager and portfolio changes).
      - name: Build Movers data
        run: |
          python scripts/normalize_amc.py
          python scripts/build_movers.py

      - name: Smoke test (validate data integrity)
        run: python tests/smoke.py

      - name: Validate research contracts
        uses: ./.github/actions/validate

      - name: Commit holdings data
        id: commit-holdings
        run: |
          git config user.name fairfund-bot
          git config user.email 52659071+nishants-lab@users.noreply.github.com
          git add public/holdings-history/ src/data/ public/fund-data/ public/category-median/
          if git diff --staged --quiet; then
            echo "No holdings changes"
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "data: monthly holdings refresh $(date +%Y-%m-%d)"
            git push
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      # A push made with GITHUB_TOKEN does not start deploy.yml, so new holdings
      # are published here instead of waiting for the next daily refresh.
      - name: Build site with new holdings
        if: steps.commit-holdings.outputs.changed == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - if: steps.commit-holdings.outputs.changed == 'true'
        run: npm ci && npm run build

      - name: Upload Pages artifact with new holdings
        if: steps.commit-holdings.outputs.changed == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-holdings
          path: dist

  # Runs after the daily deploy so the site with new holdings is the one left live.
  deploy-holdings:
    needs: [deploy-pages, monthly-holdings]
    if: ${{ !cancelled() && needs.monthly-holdings.result == 'success' && needs.monthly-holdings.outputs.changed == 'true' }}
    runs-on: ubuntu-26.04
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-holdings
