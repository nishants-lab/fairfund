name: Refresh Fund Data

on:
  schedule:
    - cron: "30 22 * * 1-5"
    - cron: "30 3 6-15,27 * *"
  workflow_dispatch:
    inputs:
      full_refresh:
        description: Run full metrics recomputation
        type: boolean
        default: false
      run_monthly:
        description: Also run monthly holdings refresh
        type: boolean
        default: false

concurrency:
  group: pages
  cancel-in-progress: true

permissions:
  contents: write
  pages: write
  id-token: write

jobs:
  daily-nav:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Append daily NAV from AMFI
        run: python scripts/update_nav_daily.py

      - name: Recompute metrics from fresh NAV
        run: python pipeline/compute_metrics.py

      - name: Recompute rankings
        run: python pipeline/compute_rankings.py

      - name: Split fund data for serving
        run: python migrations/split-analytics/split_funds.py

      - name: Smoke test (validate data integrity)
        run: python tests/smoke.py

      - name: Commit updated data
        run: |
          git config user.name fairfund-bot
          git config user.email bot@fairfund.in
          git add src/data/ public/nav/ public/fund-data/
          if git diff --staged --quiet; then
            echo "No data changes"
          else
            git commit -m "data: daily refresh $(date +%Y-%m-%d)"
            git push
          fi

      - name: Build site
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy-pages:
    needs: daily-nav
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  monthly-holdings:
    if: github.event_name == 'workflow_dispatch' && inputs.run_monthly || github.event_name == 'schedule' && github.event.schedule == '30 3 6-15,27 * *'
    runs-on: ubuntu-latest
    timeout-minutes: 120
    needs: daily-nav
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Pull latest
        run: git pull --rebase origin main

      - name: Recompute metrics
        run: python pipeline/compute_metrics.py

      - name: Recompute rankings
        run: python pipeline/compute_rankings.py

      - name: Capture holdings snapshots
        run: python scripts/capture_holdings_snapshot.py
        env:
          FF_CAPTURE_LIMIT: ""

      - name: Build stock moves
        run: python scripts/build_stock_moves.py

      - name: Compute holdings changes (MoM)
        run: python scripts/add_holdings_change.py

      - name: Enrich fund-data with AUM and expense ratio
        run: python scripts/enrich_fund_data.py

      - name: Refresh fund manager data (Groww)
        run: python scripts/fetch_managers.py
        continue-on-error: true

      - name: Build manager quality signals
        run: python scripts/build_manager_signals.py
        continue-on-error: true

      - name: Smoke test (validate data integrity)
        run: python tests/smoke.py

      - name: Commit holdings data
        run: |
          git config user.name fairfund-bot
          git config user.email bot@fairfund.in
          git add public/holdings-history/ src/data/ public/fund-data/
          if git diff --staged --quiet; then
            echo "No holdings changes"
          else
            git commit -m "data: monthly holdings refresh $(date +%Y-%m-%d)"
            git push
          fi
