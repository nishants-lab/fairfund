name: Runner canary (newest Ubuntu)

# Every other workflow pins an Ubuntu version (ubuntu-26.04 since 2026-11-10;
# the earlier jump of ubuntu-latest to 26.04 broke Playwright 1.60's Chromium
# install and the daily refresh with it, fixed by Playwright 1.65, issue #19).
# This job runs the full release gate on ubuntu-latest once a week, so the next
# image move shows up here, as an open issue, before the pin has to change.
# It publishes nothing and commits nothing.

on:
  schedule:
    - cron: '30 2 * * 1'   # Monday 08:00 IST
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: runner-canary
  cancel-in-progress: true

jobs:
  canary:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Runner image
        run: |
          . /etc/os-release
          echo "Runner OS: $PRETTY_NAME (image ${ImageOS:-unknown} ${ImageVersion:-unknown})"
          echo "OS_LABEL=$PRETTY_NAME" >> "$GITHUB_ENV"
      - name: Validate research contracts
        uses: ./.github/actions/validate
      - run: npm run build
      - run: npm run test:browser:built
      - name: Open or update the canary issue
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          title="Runner canary failed on ubuntu-latest"
          body="The weekly release gate failed on ${OS_LABEL:-ubuntu-latest}. Pinned workflows (ubuntu-26.04) are not affected yet; check this run before moving the pin: $RUN_URL"
          num=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number')
          if [ -n "$num" ]; then gh issue comment "$num" --repo "$GITHUB_REPOSITORY" --body "$body"
          else gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --body "$body"; fi
