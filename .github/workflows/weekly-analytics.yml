name: Weekly Analytics

on:
  schedule:
    # Sunday 1:00 PM IST = 07:30 UTC
    - cron: "30 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rebuild-analytics:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Rebuild forward-looking analytics
        run: python scripts/build_analytics.py

      - name: Split fund data for serving
        run: python migrations/split-analytics/split_funds.py

      - name: Smoke test
        run: python tests/smoke.py

      - name: Commit updated analytics
        run: |
          git config user.name fairfund-bot
          git config user.email bot@fairfund.in
          git add src/data/ public/fund-data/
          if git diff --staged --quiet; then
            echo "No analytics changes"
          else
            git commit -m "data: weekly analytics rebuild $(date +%Y-%m-%d)"
            git push
          fi

      - name: Build and deploy site
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci && npm run build

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
