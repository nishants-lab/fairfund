name: Weekly Analytics

on:
  schedule:
    # Sunday 1:00 PM IST = 07:30 UTC
    - cron: "30 7 * * 0"
  workflow_dispatch:

permissions:
  contents: write
  actions: write   # dispatch deploy.yml after committing

jobs:
  rebuild-analytics:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      - name: Recompute peer metrics and rankings
        run: |
          python pipeline/compute_metrics.py
          python pipeline/compute_rankings.py

      - name: Rebuild forward-looking analytics
        run: python scripts/build_analytics.py

      - name: Split fund data for serving
        run: python migrations/split-analytics/split_funds.py

      - name: Quarantine unverified NAV-derived values
        run: python scripts/quarantine_nav.py --apply

      - name: Synchronize shared analytics and verify parity
        run: |
          python scripts/sync_analytics_to_shells.py
          python scripts/sync_analytics_to_shells.py --check

      - name: Rebuild rolling-alpha series (re-inject; build_analytics drops it)
        run: python scripts/build_rolling_alpha.py

      - name: Rebuild category benchmarks from current NAV
        run: python scripts/build_category_median.py

      - name: Smoke test
        run: python tests/smoke.py

      - name: Validate research contracts
        uses: ./.github/actions/validate

      - name: Commit updated analytics
        run: |
          git config user.name fairfund-bot
          git config user.email 52659071+nishants-lab@users.noreply.github.com
          git add src/data/ public/fund-data/ public/category-median/
          if git diff --staged --quiet; then
            echo "No analytics changes"
          else
            git commit -m "data: weekly analytics rebuild $(date +%Y-%m-%d)"
            git push
          fi

      # The site is served from GitHub Actions artifacts (Pages build_type
      # "workflow"), so a gh-pages branch push is never published, and a push
      # made with GITHUB_TOKEN does not start deploy.yml on its own. Until
      # 2026-10-22 this job pushed to gh-pages and its data waited for the next
      # daily deploy. Dispatch the site's one deploy path instead.
      - name: Deploy site (dispatch deploy.yml)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh workflow run deploy.yml --repo "${{ github.repository }}" --ref main
