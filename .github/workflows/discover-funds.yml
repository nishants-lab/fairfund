name: Discover New Funds

on:
  schedule:
    - cron: "0 4 4 * *"  # 4th of each month at 04:00 UTC
  workflow_dispatch:
    inputs:
      approve_all:
        description: "Discover, onboard, and open PR for ALL eligible new funds"
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  discover:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install deps
        run: pip install -r pipeline/requirements.txt

      # Step 0: Snapshot the pre-run universe so the PR summary can diff it.
      - name: Snapshot pre-run funds.json
        run: cp src/data/funds.json "$RUNNER_TEMP/funds_before.json"

      # Step 1: Discover new funds (adds to funds.json with coverage: pending)
      - name: Discover new funds
        id: discover
        run: |
          python pipeline/discover_new_funds.py 2>&1 | tee discovery_output.txt
          # Check if any funds were added
          if grep -q "Added: 0" discovery_output.txt; then
            echo "new_funds=false" >> "$GITHUB_OUTPUT"
          else
            echo "new_funds=true" >> "$GITHUB_OUTPUT"
          fi

      # Step 1.5: Refresh the CAMS matcher universe (every AMFI Growth scheme,
      # Direct + Regular, all asset classes). Runs unconditionally: the matcher
      # superset must track AMFI even in months with no new analytics funds.
      - name: Rebuild matcher universe
        run: python pipeline/build_matcher_universe.py

      # Step 2: Onboard new funds (resolve slugs, validate, fetch initial holdings)
      - name: Onboard new funds
        if: steps.discover.outputs.new_funds == 'true'
        run: python scripts/onboard_new_funds.py 2>&1 | tee onboard_report.md

      # Step 3: Recompute metrics for new funds
      - name: Recompute metrics and rankings
        if: steps.discover.outputs.new_funds == 'true'
        run: |
          python pipeline/compute_metrics.py
          python pipeline/compute_rankings.py
          python scripts/build_analytics.py
          python migrations/split-analytics/split_funds.py

      # Step 3.5: Prune funds that failed onboarding (no holdings on Groww)
      - name: Prune unresolvable funds
        if: steps.discover.outputs.new_funds == 'true'
        run: python scripts/prune_pending.py

      # Step 3.6: QA gate - block the PR if data is bad (debt funds, broken ranks, orphans, etc.)
      - name: QA gate (smoke tests)
        if: steps.discover.outputs.new_funds == 'true'
        run: python tests/smoke.py

      # Step 4: Check for changes and open PR
      - name: Check for changes
        id: check
        run: |
          git add src/data/ public/nav/ public/fund-data/ public/holdings-history/
          if git diff --staged --quiet; then
            echo "changes=false" >> "$GITHUB_OUTPUT"
          else
            echo "changes=true" >> "$GITHUB_OUTPUT"
            echo "$(git diff --staged --stat | tail -1)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Create PR
        if: steps.check.outputs.changes == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          BRANCH="discovery/$(date +%Y-%m)"
          git config user.name fairfund-bot
          git config user.email bot@fairfund.in
          git checkout -b "$BRANCH"
          git commit -m "discovery: new funds $(date +%Y-%m-%d)"
          git push -f origin "$BRANCH"

          # Close existing discovery PR for this month if any
          gh pr list --head "$BRANCH" --state open --json number -q '.[].number' | \
            xargs -I{} gh pr close {} --comment "Superseded by new run" 2>/dev/null || true

          # Build PR body: concise summary first, raw logs collapsed below.
          REPORT=""
          if [ -f onboard_report.md ]; then
            REPORT=$(cat onboard_report.md)
          fi

          SUMMARY=$(python scripts/discovery_summary.py --before "$RUNNER_TEMP/funds_before.json" 2>&1 || echo "Summary generation failed; see raw log.")

          BODY="$SUMMARY

          <details><summary>Raw discovery log</summary>

          \`\`\`
          $(cat discovery_output.txt)
          \`\`\`
          </details>

          ### Onboarding Report
          ${REPORT:-No onboarding output.}

          **Review the diff**, then merge. Funds with slug mismatches are skipped and logged above for manual resolution."

          gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "discovery: new funds $(date +'%B %Y')" \
            --body "$BODY"

      - name: No changes
        if: steps.check.outputs.changes != 'true'
        run: echo "No new funds discovered this month." >> "$GITHUB_STEP_SUMMARY"
