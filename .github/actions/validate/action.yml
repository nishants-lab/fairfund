name: Validate research contracts
description: Execute production-code, data-structure and browser regressions before publication
runs:
  using: composite
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version: 22
        cache: npm
    - uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - run: python -m pip install -r pipeline/requirements.txt
      shell: bash
    - run: npm ci
      shell: bash
    # Retries the download and survives an unreachable Ubuntu archive; see the script.
    - run: bash scripts/ci/install-browser.sh
      shell: bash
    - run: npm run check:release
      shell: bash
